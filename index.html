<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <title>Znalazłeś moją rzecz? | If found</title>
  <style>
    :root{color-scheme:light;--ink:#171717;--muted:#626262;--yellow:#ffd629;--green:#147a3d;--line:#e5e5e5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f5f5f3;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}
    main{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 12px 40px #00000012;text-align:center}
    .mark{width:76px;height:76px;margin:2px auto 18px;border-radius:22px;background:#f1f8f2;display:grid;place-items:center;font-size:38px}
    h1{font-size:clamp(25px,6vw,32px);line-height:1.15;margin:0 0 8px;letter-spacing:-.7px}
    .thanks{font-weight:700;font-size:19px;margin:0 0 12px}
    .copy{color:var(--muted);margin:0 auto 24px;max-width:310px}
    .actions{display:grid;gap:12px}
    a.action{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:14px 18px;border-radius:14px;text-decoration:none;font-weight:750}
    .call{background:var(--green);color:#fff}
    .save{background:#fff;color:var(--ink);border:1.5px solid #cfcfcf}
    .phone{font-size:14px;font-weight:600;opacity:.92}
    .lang{margin-top:22px;border:0;background:transparent;color:#555;text-decoration:underline;text-underline-offset:3px;font:inherit;font-size:14px;cursor:pointer}
    footer{margin-top:18px;color:#888;font-size:12px}
    a:focus-visible,button:focus-visible{outline:3px solid #4c9ffe;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">📦</div>
    <h1 id="heading">Znalazłeś moją rzecz?</h1>
    <p class="thanks" id="thanks">Dziękuję!</p>
    <p class="copy" id="copy">Jeśli możesz, skontaktuj się ze mną — pomóż mi ją odzyskać.</p>
    <div class="actions">
      <a class="action call" href="tel:+48602228121">
        <span aria-hidden="true">☎</span>
        <span><span id="call-label">Zadzwoń teraz</span><br><span class="phone">+48 602 228 121</span></span>
      </a>
      <a class="action save" href="./contact.vcf" download>
        <span aria-hidden="true">＋</span><span id="save-label">Zapisz kontakt</span>
      </a>
    </div>
    <button class="lang" id="language" type="button" aria-label="Switch language">English</button>
    <footer id="footer">Dziękuję za pomoc!</footer>
  </main>
  <script>
    const translations = {
      pl: {heading:"Znalazłeś moją rzecz?",thanks:"Dziękuję!",copy:"Jeśli możesz, skontaktuj się ze mną — pomóż mi ją odzyskać.",call:"Zadzwoń teraz",save:"Zapisz kontakt",footer:"Dziękuję za pomoc!",button:"English",lang:"pl"},
      en: {heading:"Have you found my item?",thanks:"Thank you!",copy:"Please get in touch so you can help me get it back.",call:"Call me now",save:"Save contact",footer:"Thank you for your help!",button:"Polski",lang:"en"}
    };
    let current = "pl";
    document.getElementById("language").addEventListener("click", () => {
      current = current === "pl" ? "en" : "pl";
      const t = translations[current];
      document.documentElement.lang = t.lang;
      document.getElementById("heading").textContent = t.heading;
      document.getElementById("thanks").textContent = t.thanks;
      document.getElementById("copy").textContent = t.copy;
      document.getElementById("call-label").textContent = t.call;
      document.getElementById("save-label").textContent = t.save;
      document.getElementById("footer").textContent = t.footer;
      document.getElementById("language").textContent = t.button;
    });
  </script>
</body>
</html>
